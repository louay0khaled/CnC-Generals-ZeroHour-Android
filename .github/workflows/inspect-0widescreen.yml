name: Inspect 0Widescreen.big

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Inspect BIG
        shell: python
        run: |
          from pathlib import Path
          import struct, zlib, hashlib, re

          p=Path("0Widescreen.big")
          b=p.read_bytes()
          print("FILE_SIZE", len(b))
          print("SHA256", hashlib.sha256(b).hexdigest())
          print("MAGIC", b[:4])

          if b[:4] != b"BIGF":
              raise SystemExit("Not BIGF")

          total=struct.unpack_from("<I",b,4)[0]
          count=struct.unpack_from(">I",b,8)[0]
          data_start=struct.unpack_from(">I",b,12)[0]
          print("TOTAL", total, "COUNT", count, "DATA_START", data_start)

          pos=16
          entries=[]
          for i in range(count):
              off,size=struct.unpack_from(">II",b,pos)
              pos+=8
              end=b.index(b"\0",pos)
              name=b[pos:end].decode("ascii",errors="replace")
              pos=end+1
              entries.append((name,off,size))
          print("INDEX_END",pos)

          exts={}
          for name,off,size in entries:
              ext=Path(name).suffix.lower() or "<none>"
              exts[ext]=exts.get(ext,0)+1

          print("EXTENSIONS", sorted(exts.items()))
          print("FIRST_200_NAMES")
          for name,off,size in entries[:200]:
              print(name, off, size)

          interesting=re.compile(r"(gamedata|gamespy|network|online|version|controlbar|mappedimages|\.wnd$)",re.I)
          print("INTERESTING")
          for name,off,size in entries:
              if interesting.search(name):
                  print(name, off, size)

          print("CRC_TARGET_FILES")
          for name,off,size in entries:
              if re.search(r"(^|\\/)(GameData\.ini|GameNetwork\.ini|ControlBarScheme\.ini)$", name, re.I):
                  payload=b[off:off+size]
                  print(name, "size",size,"crc32",f"{zlib.crc32(payload)&0xffffffff:08X}","sha256",hashlib.sha256(payload).hexdigest())
          