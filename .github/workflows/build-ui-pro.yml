name: Build Generals UI Pro 1640x720

on:
  push:
    branches: [ui-pro]
    paths-ignore:
      - 'UIPro/Release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout official Control Bar Pro source
        uses: actions/checkout@v4
        with:
          repository: TheSuperHackers/GeneralsControlBar
          ref: main
          path: _controlbar_source
          fetch-depth: 1

      - name: Checkout official Generals Game Patch source
        uses: actions/checkout@v4
        with:
          repository: TheSuperHackers/GeneralsGamePatch
          ref: main
          path: _gamepatch_source
          fetch-depth: 1

      - name: Install image/PSD build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow psd-tools

      - name: Build exact 1640x720 UI package
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE/UIPro/build_1640x720.py" --controlbar-root "$env:GITHUB_WORKSPACE/_controlbar_source/ControlBarProZH" --gamepatch-root "$env:GITHUB_WORKSPACE/_gamepatch_source/Patch104pZH" --official-zip "$env:GITHUB_WORKSPACE/_controlbar_source/ControlBarProZH/Release/ControlBarProZH_v1.2_1920x1080.zip" --out "$env:GITHUB_WORKSPACE/UIPro/Build1640"

      - name: Verify final package contents
        shell: pwsh
        run: |
          $dir = "$env:GITHUB_WORKSPACE/UIPro/Build1640"
          $expected = @(
            "340_ControlBarProZH.big",
            "340_ControlBarProArt1080ZH.big",
            "340_ControlBarPro1640x720ZH.big",
            "340_ControlBarPro0_MenusZH.big",
            "340_ControlBarPro0_SkinGadgetsZH.big",
            "340_ControlBarPro0_SkinLoadingZH.big",
            "340_ControlBarPro0_SkinBackgroundZH.big",
            "README_1640x720_AR.txt"
          )

          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path $dir $name))) {
              throw "Missing final package file: $name"
            }
          }

          $zip = "$env:GITHUB_WORKSPACE/UIPro/GeneralsUIPro_1640x720_Android_v2.zip"
          if (-not (Test-Path $zip)) {
            throw "Missing final ZIP: $zip"
          }

          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); expected=set(sys.argv[2:]); actual=set(z.namelist()); assert actual==expected,(expected-actual,actual-expected); print('Final ZIP verified:',sorted(actual))" "$zip" @expected

      - name: Stage release files
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE/UIPro/Build1640"
          $dest = "$env:GITHUB_WORKSPACE/UIPro/Release"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem $dest -File | Remove-Item -Force

          Copy-Item "$source/*.big" $dest -Force
          Copy-Item "$source/README_1640x720_AR.txt" $dest -Force
          Copy-Item "$env:GITHUB_WORKSPACE/UIPro/GeneralsUIPro_1640x720_Android_v2.zip" $dest -Force

          foreach ($file in Get-ChildItem $dest -File) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Set-Content -NoNewline -Encoding ascii "$($file.FullName).sha256"
          }

      - name: Upload 1640x720 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsUIPro-1640x720-Android
          path: |
            UIPro/Release/*.big
            UIPro/Release/*.zip
            UIPro/Release/*.txt
            UIPro/Release/*.sha256
          if-no-files-found: error

      - name: Commit release files
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f UIPro/Release/
          git add UIPro/build_1640x720.py .github/workflows/build-ui-pro.yml
          git rm -f --ignore-unmatch UIPro/build_menu_big.py UIPro/prepare_official_build.py UIPro/verify_modbuilder_release.py
          git diff --cached --quiet
          if not errorlevel 1 exit /b 0
          git commit -m "Build exact Generals UI Pro 1640x720 package"
          if errorlevel 1 exit /b %errorlevel%
          git push origin HEAD:ui-pro
