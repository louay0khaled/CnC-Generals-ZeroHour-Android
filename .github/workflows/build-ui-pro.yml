name: Build Generals UI Pro BIG

on:
  push:
    branches: [ui-pro]
    paths-ignore:
      - 'UIPro/Release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Control Bar Pro source
        uses: actions/checkout@v4
        with:
          repository: TheSuperHackers/GeneralsControlBar
          ref: main
          path: _controlbar_source
          fetch-depth: 1
          sparse-checkout: |
            ControlBarProZH/GameFilesOriginal/Window/Menus
            ControlBarProZH/GameFilesEdited/Window/Menus
          sparse-checkout-cone-mode: false

      - name: Build BIG
        run: |
          python3 UIPro/build_menu_big.py             --original "_controlbar_source/ControlBarProZH/GameFilesOriginal/Window/Menus"             --edited "_controlbar_source/ControlBarProZH/GameFilesEdited/Window/Menus"             --output "UIPro/Release/340_UIProAllMenusZH.big"
          sha256sum UIPro/Release/GeneralsUIPro_AllMenus.big > UIPro/Release/340_UIProAllMenusZH.big.sha256

      - name: Upload BIG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsUIPro-AllMenus
          path: |
            UIPro/Release/340_UIProAllMenusZH.big
            UIPro/Release/340_UIProAllMenusZH.big.sha256
          if-no-files-found: error

      - name: Commit BIG into ui-pro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f UIPro/Release/GeneralsUIPro_AllMenus.big UIPro/Release/GeneralsUIPro_AllMenus.big.sha256
          if git diff --cached --quiet; then
            echo "No output change."
            exit 0
          fi
          git commit -m "Build Generals UI Pro all-menus BIG"
          git push origin HEAD:ui-pro
