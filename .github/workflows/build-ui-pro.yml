name: Build Generals UI Pro All Menus

on:
  push:
    branches: [ui-pro]
    paths-ignore:
      - 'UIPro/Release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Control Bar Pro menu source
        uses: actions/checkout@v4
        with:
          repository: TheSuperHackers/GeneralsControlBar
          ref: main
          path: _controlbar_source
          fetch-depth: 1
          sparse-checkout: |
            ControlBarProZH/GameFilesOriginal/Window/Menus
            ControlBarProZH/GameFilesEdited/Window/Menus
          sparse-checkout-cone-mode: false

      - name: Build all-menu WND BIG
        run: |
          python3 UIPro/build_menu_big.py             --original "_controlbar_source/ControlBarProZH/GameFilesOriginal/Window/Menus"             --edited "_controlbar_source/ControlBarProZH/GameFilesEdited/Window/Menus"             --output "UIPro/Release/000_UIProAllMenusZH.big"
          sha256sum UIPro/Release/000_UIProAllMenusZH.big > UIPro/Release/000_UIProAllMenusZH.big.sha256

      - name: Verify BIG structure
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path("UIPro/Release/000_UIProAllMenusZH.big")
          b = p.read_bytes()
          assert b[:4] == b"BIGF", b[:4]
          count = struct.unpack(">I", b[8:12])[0]
          assert count == 37, count
          off = struct.unpack(">I", b[12:16])[0]
          i = 16
          names = []
          for _ in range(count):
              i += 8
              end = b.index(b"\0", i)
              names.append(b[i:end].decode("ascii"))
              i = end + 1
          assert all(x.startswith("Window/Menus/") for x in names)
          assert len(set(names)) == 37
          print("Verified BIG header and 37 Window/Menus entries")
          PY

      - name: Upload BIG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsUIPro-AllMenus
          path: |
            UIPro/Release/000_UIProAllMenusZH.big
            UIPro/Release/000_UIProAllMenusZH.big.sha256
          if-no-files-found: error

      - name: Commit BIG into ui-pro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f UIPro/Release/000_UIProAllMenusZH.big UIPro/Release/000_UIProAllMenusZH.big.sha256
          if git diff --cached --quiet; then
            echo "No output change."
            exit 0
          fi
          git commit -m "Build themed all-menu BIG"
          git push origin HEAD:ui-pro
