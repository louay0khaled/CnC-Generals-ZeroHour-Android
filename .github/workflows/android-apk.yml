name: Android APK build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
      - 'BUILDING.md'

permissions:
  contents: read

env:
  ANDROID_API: '28'
  ANDROID_NDK: '27.2.12479018'
  SDL3_VERSION: '3.4.2'

jobs:
  build-arm64-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source archive equivalent
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"

      - name: Install native build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config python3-pip unzip
          cmake --version
          ninja --version
          meson --version

      - name: Install vcpkg native dependencies for Android
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          VCPKG_MANIFEST_MODE=OFF "$RUNNER_TEMP/vcpkg/vcpkg" install \
            zlib:arm64-android \
            glm:arm64-android \
            gli:arm64-android \
            freetype:arm64-android \
            --x-install-root "$RUNNER_TEMP/vcpkg-installed"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLED=$RUNNER_TEMP/vcpkg-installed" >> "$GITHUB_ENV"

      - name: Build SDL3 for arm64 Android (for DXVK WSI)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/sdl3-src" "$RUNNER_TEMP/sdl3-build" "$RUNNER_TEMP/sdl3-install"
          curl -L --fail --retry 5 \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.tar.gz" \
            -o "$RUNNER_TEMP/sdl3.tar.gz"
          echo "ef39a2e3f9a8a78296c40da701967dd1b0d0d6e267e483863ce70f8a03b4050c  $RUNNER_TEMP/sdl3.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sdl3.tar.gz" -C "$RUNNER_TEMP/sdl3-src" --strip-components=1
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" -S "$RUNNER_TEMP/sdl3-src" -B "$RUNNER_TEMP/sdl3-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3-install" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --build "$RUNNER_TEMP/sdl3-build" --target install --parallel 4
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          cat > "$RUNNER_TEMP/pkgconfig/sdl3.pc" <<EOF
prefix=$RUNNER_TEMP/sdl3-install
exec_prefix=\${prefix}
libdir=\${prefix}/lib
includedir=\${prefix}/include

Name: sdl3
Description: SDL3
Version: ${SDL3_VERSION}
Libs: -L\${libdir} -lSDL3
Cflags: -I\${includedir}
EOF
          cat > "$RUNNER_TEMP/pkgconfig/vulkan.pc" <<EOF
prefix=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
includedir=\${prefix}/usr/include

Name: vulkan
Description: Android Vulkan headers and platform loader
Version: 1.3
Libs: -lvulkan
Cflags: -I\${includedir}
EOF

      - name: Prepare DXVK Android cross build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf engine/references/fbraz3-dxvk
          git clone --depth 1 --branch generalsx-macos-v2.6 https://github.com/fbraz3/dxvk.git engine/references/fbraz3-dxvk
          export DXVK_SRC="$GITHUB_WORKSPACE/engine/references/fbraz3-dxvk"
          export NDK_BIN="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export NDK_SYSROOT="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cat > "$RUNNER_TEMP/meson-arm64-android.ini" <<EOF
[binaries]
c = '$NDK_BIN/aarch64-linux-android${ANDROID_API}-clang'
cpp = '$NDK_BIN/aarch64-linux-android${ANDROID_API}-clang++'
ar = '$NDK_BIN/llvm-ar'
strip = '$NDK_BIN/llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[properties]
sys_root = '$NDK_SYSROOT'

[built-in options]
c_args = ['-DVK_ENABLE_BETA_EXTENSIONS', '-DVK_USE_PLATFORM_ANDROID_KHR']
cpp_args = ['-DVK_ENABLE_BETA_EXTENSIONS', '-DVK_USE_PLATFORM_ANDROID_KHR']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
EOF
          export PKG_CONFIG_PATH="$RUNNER_TEMP/pkgconfig"
          meson setup "$RUNNER_TEMP/dxvk-build" "$DXVK_SRC" \
            --cross-file "$RUNNER_TEMP/meson-arm64-android.ini" \
            -Ddxvk_native_wsi=sdl3 \
            -Dbuildtype=release
          ninja -C "$RUNNER_TEMP/dxvk-build"
          DXVK_D3D8=$(find "$RUNNER_TEMP/dxvk-build" -type f -name 'libdxvk_d3d8.so*' | head -1)
          DXVK_D3D9=$(find "$RUNNER_TEMP/dxvk-build" -type f -name 'libdxvk_d3d9.so*' | head -1)
          test -n "$DXVK_D3D8"
          test -n "$DXVK_D3D9"
          readelf -h "$DXVK_D3D8" | grep -q 'AArch64'
          readelf -h "$DXVK_D3D9" | grep -q 'AArch64'
          strings "$DXVK_D3D9" | grep -q 'Sdl3WsiDriver'
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs/arm64-v8a"
          cp "$DXVK_D3D8" "$GITHUB_WORKSPACE/android/app/libs/arm64-v8a/libdxvk_d3d8.so"
          cp "$DXVK_D3D9" "$GITHUB_WORKSPACE/android/app/libs/arm64-v8a/libdxvk_d3d9.so"
          echo "DXVK_SRC=$DXVK_SRC" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Patch Android-only CMake conditionals from the supplied source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dx8 = Path('engine/cmake/dx8.cmake')
          text = dx8.read_text()
          marker = 'elseif(APPLE AND SAGE_USE_MOLTENVK)'
          android_branch = '''elseif(ANDROID)\n  # Android: DXVK is cross-built by CI with Meson before the engine build.\n  # The engine only needs DXVK headers here; the APK packages the resulting .so files.\n  set(DXVK_SOURCE_DIR "$ENV{DXVK_SRC}" CACHE PATH "DXVK native Android source")\n  if(NOT DXVK_SOURCE_DIR OR NOT EXISTS "${DXVK_SOURCE_DIR}/include/native")\n    message(FATAL_ERROR "Android DXVK source not found. DXVK_SRC must point to a checkout containing include/native.")\n  endif()\n  set(dxvk_SOURCE_DIR "${DXVK_SOURCE_DIR}" CACHE PATH "DXVK native Android source")\n  message(STATUS "Using prebuilt Android DXVK from ${DXVK_SOURCE_DIR}")\n\n'''
          if 'elseif(ANDROID)' not in text:
              text = text.replace(marker, android_branch + marker, 1)
              dx8.write_text(text)

          w = Path('engine/Core/Libraries/Source/WWVegas/WW3D2/CMakeLists.txt')
          text = w.read_text()
          text = text.replace('    find_package(Fontconfig REQUIRED)\n', '    if(NOT ANDROID)\n        find_package(Fontconfig REQUIRED)\n    endif()\n')
          text = text.replace('    find_package(Iconv REQUIRED)\n', '    if(NOT ANDROID)\n        find_package(Iconv REQUIRED)\n    endif()\n')
          text = text.replace('    $<$<PLATFORM_ID:Android>:Fontconfig::Fontconfig>\n', '')
          text = text.replace('    $<$<PLATFORM_ID:Android>:Iconv::Iconv>\n', '')
          w.write_text(text)
          PY

      - name: Configure and build Generals Zero Hour engine
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S engine -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DCMAKE_BUILD_TYPE=Release \
            -DSAGE_USE_DX8=OFF \
            -DSAGE_USE_SDL3=ON \
            -DSAGE_USE_OPENAL=ON \
            -DSAGE_USE_MINIAUDIO=OFF \
            -DSAGE_UPDATE_CHECK=OFF \
            -DRTS_BUILD_OPTION_FFMPEG=OFF \
            -DRTS_BUILD_OPTION_SAGE_PATCH=OFF \
            -DRTS_BUILD_CORE_TOOLS=OFF \
            -DRTS_BUILD_GENERALS=OFF \
            -DRTS_BUILD_ZEROHOUR=ON
          cmake --build build/android-arm64 --target z_generals --parallel 4

      - name: Stage native Android libraries
        shell: bash
        run: |
          set -euxo pipefail
          LIBDIR="$GITHUB_WORKSPACE/android/app/libs/arm64-v8a"
          mkdir -p "$LIBDIR"
          MAIN=$(find build/android-arm64 -type f -name 'libmain.so' | head -1)
          SDL=$(find build/android-arm64 -type f -name 'libSDL3.so' | head -1)
          SDLI=$(find build/android-arm64 -type f -name 'libSDL3_image.so' | head -1)
          OPENAL=$(find build/android-arm64 -type f -name 'libopenal.so*' | head -1)
          test -n "$MAIN"
          test -n "$SDL"
          test -n "$OPENAL"
          cp "$MAIN" "$LIBDIR/libmain.so"
          cp "$SDL" "$LIBDIR/libSDL3.so"
          if [ -n "$SDLI" ]; then cp "$SDLI" "$LIBDIR/libSDL3_image.so"; fi
          cp "$OPENAL" "$LIBDIR/libopenal.so"
          find "$LIBDIR" -maxdepth 1 -type f -name '*.so' -print
          for f in "$LIBDIR"/*.so; do readelf -h "$f" | grep -q 'AArch64'; done

      - name: Assemble APK
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CnC-Generals-ZeroHour-Android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
