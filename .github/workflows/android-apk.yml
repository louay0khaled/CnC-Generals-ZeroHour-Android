name: Android APK build from uploaded archive

on:
  workflow_dispatch:
  push:
    paths:
      - CnC-Generals-ZeroHour-Android-0.1.0.zip
      - .github/workflows/android-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          test -f CnC-Generals-ZeroHour-Android-0.1.0.zip
          sha256sum CnC-Generals-ZeroHour-Android-0.1.0.zip
          rm -rf "$RUNNER_TEMP/generals-source"
          mkdir -p "$RUNNER_TEMP/generals-source"
          unzip -q CnC-Generals-ZeroHour-Android-0.1.0.zip -d "$RUNNER_TEMP/generals-source"
          test -f "$RUNNER_TEMP/generals-source/CnC-Generals-ZeroHour-Android-0.1.0/BUILDING.md"
          test -f "$RUNNER_TEMP/generals-source/CnC-Generals-ZeroHour-Android-0.1.0/android/gradlew"
          test -d "$RUNNER_TEMP/generals-source/CnC-Generals-ZeroHour-Android-0.1.0/engine"
          echo "Archive verification passed."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null || true
          echo "Android toolchain installed."

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config git unzip
          cmake --version
          ninja --version
          meson --version

      - name: Prepare source marker
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/generals-source/CnC-Generals-ZeroHour-Android-0.1.0"
          printf '%s\n' "$SRC" > "$RUNNER_TEMP/source-dir.txt"
          echo "Using archive-extracted source only: $SRC"

      - name: Archive source build check
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(cat "$RUNNER_TEMP/source-dir.txt")
          test "$(basename "$SRC")" = CnC-Generals-ZeroHour-Android-0.1.0
          test -f "$SRC/android/gradlew"
          test -f "$SRC/engine/CMakeLists.txt"
          echo "The build source is exclusively the uploaded ZIP contents."
