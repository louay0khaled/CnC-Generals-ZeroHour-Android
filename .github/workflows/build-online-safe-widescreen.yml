name: Build online-safe 0Widescreen

on:
  push:
    paths:
      - ".github/workflows/build-online-safe-widescreen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strip CRC-sensitive files and rebuild BIG
        shell: python
        run: |
          import os
          import struct
          from pathlib import Path

          src = Path("0Widescreen.big")
          out = Path("0Widescreen_OnlineSafe.big")
          raw = src.read_bytes()

          if raw[:4] != b"BIGF":
              raise SystemExit("0Widescreen.big is not a BIGF archive")

          total_size = struct.unpack("<I", raw[4:8])[0]\n          file_count, data_start = struct.unpack(">II", raw[8:16])
          if total_size != len(raw):
              raise SystemExit(f"Header size mismatch: header={total_size}, actual={len(raw)}")

          pos = 16
          entries = []
          for _ in range(file_count):
              if pos + 8 > len(raw):
                  raise SystemExit("Truncated BIG directory entry")
              offset, size = struct.unpack(">II", raw[pos:pos+8])
              pos += 8
              end = raw.find(b"\x00", pos)
              if end < 0:
                  raise SystemExit("Unterminated BIG filename")
              name = raw[pos:end].decode("latin-1")
              pos = end + 1
              if offset + size > len(raw):
                  raise SystemExit(f"Invalid data range for {name}")
              entries.append((name, raw[offset:offset+size]))

          # Generals Online's important INI CRC must remain vanilla.
          # Remove every INI from this legacy widescreen archive, plus the backup.
          kept = []
          removed = []
          for name, data in entries:
              low = name.replace("/", "\\").lower()
              if low.endswith(".ini") or low.endswith(".bak"):
                  removed.append(name)
              else:
                  kept.append((name, data))

          if not kept:
              raise SystemExit("Nothing left after stripping")

          directory_size = sum(8 + len(name.encode("latin-1")) + 1 for name, _ in kept)
          new_data_start = (16 + directory_size + 15) & ~15
          cursor = new_data_start

          directory = bytearray()
          payload = bytearray()
          for name, data in kept:
              name_b = name.encode("latin-1")
              directory += struct.pack(">II", cursor, len(data))
              directory += name_b + b"\x00"
              payload += data
              cursor += len(data)

          new_total = new_data_start + len(payload)
          out.write_bytes(
              b"BIGF"
              + struct.pack("<I", new_total) + struct.pack(">II", len(kept), new_data_start)
              + directory
              + payload
          )

          # Independent validation of the rebuilt archive.
          check = out.read_bytes()
          h_size = struct.unpack("<I", check[4:8])[0]\n          h_count, h_start = struct.unpack(">II", check[8:16])
          if check[:4] != b"BIGF" or h_size != len(check) or h_count != len(kept) or h_start != new_data_start:
              raise SystemExit("Rebuilt BIG validation failed")

          p = 16
          names = []
          for _ in range(h_count):
              off, sz = struct.unpack(">II", check[p:p+8])
              p += 8
              e = check.find(b"\x00", p)
              n = check[p:e].decode("latin-1")
              p = e + 1
              if off + sz > len(check):
                  raise SystemExit(f"Rebuilt BIG has invalid range: {n}")
              names.append(n)

          if any(n.lower().endswith((".ini", ".bak")) for n in names):
              raise SystemExit("Forbidden INI/BAK entry remains")

          print(f"Original: {file_count} files, {len(raw):,} bytes")
          print(f"Removed: {len(removed)}")
          for n in removed:
              print(f"  - {n}")
          print(f"Kept: {len(kept)}")
          for n in names:
              print(f"  + {n}")
          print(f"Output: {len(check):,} bytes")
          Path("ONLINE_SAFE_MANIFEST.txt").write_text(
              "Removed for Generals Online CRC safety:\n"
              + "".join(f"- {n}\n" for n in removed)
              + "\nKept:\n"
              + "".join(f"- {n}\n" for n in names),
              encoding="utf-8",
          )

      - name: Upload modified BIG
        uses: actions/upload-artifact@v4
        with:
          name: 0Widescreen_OnlineSafe
          path: |
            0Widescreen_OnlineSafe.big
            ONLINE_SAFE_MANIFEST.txt
          if-no-files-found: error
